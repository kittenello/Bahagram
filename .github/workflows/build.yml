name: Build Bahogram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select required Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Required Xcode not found: $XCODE_PATH"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sw_vers

      - name: Prepare canonical source path
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared/telegram-ios
          sudo chown -R "$(id -u):$(id -g)" /Users/Shared/telegram-ios
          rsync -a --delete "$GITHUB_WORKSPACE/" /Users/Shared/telegram-ios/

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_telegram_ios"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "Build number: $BUILD_NUMBER"

          python3 build-system/Make/ImportCertificates.py             --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py             --bazelUserRoot="$BAZEL_USER_ROOT"             build             --configurationPath="build-system/appstore-configuration.json"             --codesigningInformationPath=build-system/fake-codesigning             --configuration=release_arm64             --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"

          IPA_PATH="$(find bazel-out -type f -path '*/Telegram/Telegram.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "Telegram.ipa was not produced."
            find bazel-out -type f -name '*.ipa' -print || true
            exit 1
          fi

          cp "$IPA_PATH" "$GITHUB_WORKSPACE/build-artifacts/Bahogram.ipa"
          ls -lh "$GITHUB_WORKSPACE/build-artifacts/Bahogram.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bahogram-IPA
          path: build-artifacts/Bahogram.ipa
          if-no-files-found: error
          retention-days: 14
